<body class="h-full bg-surface text-on-surface font-body-md flex items-center justify-center p-gutter">
<main class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] p-stack-lg flex flex-col gap-stack-lg relative overflow-hidden">
<!-- Header / Branding -->
<header class="flex flex-col items-center text-center gap-stack-sm">
<div class="w-20 h-20 mb-stack-sm flex items-center justify-center">
<!-- Placeholder for National Emblem -->
<img class="w-full h-full object-contain" data-alt="A clean, minimalist vector graphic of the National Emblem of India, isolated on a white background. Rendered in a strict, high-contrast monochrome style suitable for an official government portal. Deep navy blue lines against stark white. Authoritative, precise, and highly detailed linework. Modern corporate lighting aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDW_UicJWC9AYhtjef6Y4CPTw3vsl2DD6bTLRZEtcFcc5WYiAkuEssIlfxCze4919FRvel9c6Zo1rl9ginQ90YF2CKipkwHL7pOGUJlvSrieA7xouGHb9wlFSBUMrxFonsx4bbjexZujBEyoeVaBr0KCiRXvR1sk3FScO4LxfpiRtJDk-qSKwFtfpo9K9EjMPpj0lMi8knAowY--xCFuAxpdRlHW6L9CV7XL8Fhh2b9Y6ndnklu0D20BQ"/>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary">Relief Grid</h1>
<h2 class="font-headline-sm text-headline-sm text-on-surface-variant">Guwahati District</h2>
<p class="font-label-sm text-label-sm text-error mt-base uppercase tracking-wider">Authorized Personnel Only</p>
</header>
<!-- Login Form -->
<form class="flex flex-col gap-stack-md w-full">
<!-- Officer ID -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant" for="officer-id">Officer ID</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="badge">badge</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-outline-variant rounded focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors font-body-md text-on-surface" id="officer-id" name="officer-id" placeholder="Enter your ID" required="" type="text"/>
</div>
</div>
<!-- Authentication Method Toggle (Simulated) -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant" for="auth-method">Authentication Method</label>
<div class="flex rounded border border-outline-variant overflow-hidden">
<button class="flex-1 py-2 font-label-md text-label-md bg-surface-container text-primary border-r border-outline-variant" type="button">OTP (SMS)</button>
<button class="flex-1 py-2 font-label-md text-label-md bg-surface-container-lowest text-on-surface-variant hover:bg-surface-container-low transition-colors" type="button">Secure Password</button>
</div>
</div>
<!-- OTP Input -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant flex justify-between" for="otp">
                    One-Time Password
                    <button class="text-secondary hover:underline font-label-sm text-label-sm" type="button">Request OTP</button>
</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="dialpad">dialpad</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-outline-variant rounded focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors font-body-md text-on-surface tracking-widest" id="otp" maxlength="6" name="otp" placeholder="••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="mt-stack-sm w-full py-3 bg-primary text-on-primary font-label-md text-label-md rounded flex items-center justify-center gap-2 hover:bg-on-primary-fixed-variant transition-colors" type="submit">
<span class="material-symbols-outlined text-[18px]" data-icon="lock" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock</span>
                Authenticate &amp; Access
            </button>
</form>
<!-- Footer / Notices -->
<footer class="mt-stack-md text-center flex flex-col gap-stack-sm pt-stack-md border-t border-outline-variant">
<p class="font-label-sm text-label-sm text-on-surface-variant">Government of Assam • Disaster Management Authority</p>
<div class="flex justify-center gap-gutter font-label-sm text-label-sm text-secondary">
<a class="hover:underline" href="#">System Status</a>
<a class="hover:underline" href="#">Help Desk</a>
</div>
<p class="font-body-sm text-body-sm text-outline mt-base text-[10px]">
                Unauthorized access to this system is strictly prohibited and subject to prosecution under applicable cyber laws.
            </p>
</footer>
<!-- Decorative Accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary"></div>
