<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Official Government Seal Outline -->
  <circle cx="50" cy="50" r="46" stroke="#0F2042" stroke-width="2.5" fill="#FFFFFF"/>
  <circle cx="50" cy="50" r="42" stroke="#1E3A8A" stroke-width="1" stroke-dasharray="2 2" fill="none"/>
  
  <!-- Stylized Ashoka Lion Capital / Institutional Crest -->
  <g transform="translate(50, 48) scale(0.85)">
    <!-- Base Abacus -->
    <rect x="-24" y="24" width="48" height="6" rx="2" fill="#0F2042"/>
    <rect x="-20" y="32" width="40" height="4" rx="1" fill="#1E3A8A"/>
    
    <!-- Central Dharma Chakra -->
    <circle cx="0" cy="27" r="2.5" fill="#FFFFFF"/>
    <circle cx="0" cy="27" r="1.5" stroke="#0F2042" stroke-width="0.5"/>
    
    <!-- Central Lion Figure -->
    <path d="M-7 24 C-8 12, -14 0, -10 -18 C-8 -26, 8 -26, 10 -18 C14 0, 8 12, 7 24 Z" fill="#0F2042"/>
    <path d="M-5 -18 C-2 -24, 2 -24, 5 -18 C6 -10, 4 4, 0 10 C-4 4, -6 -10, -5 -18 Z" fill="#1E3A8A"/>
    
    <!-- Left Lion Figure -->
    <path d="M-15 24 C-18 16, -24 6, -20 -8 C-17 -16, -9 -14, -8 -8 C-8 2, -11 14, -13 24 Z" fill="#0F2042"/>
    <!-- Right Lion Figure -->
    <path d="M15 24 C18 16, 24 6, 20 -8 C17 -16, 9 -14, 8 -8 C8 2, 11 14, 13 24 Z" fill="#0F2042"/>
    
    <!-- Crest Crown -->
    <path d="M-4 -26 L0 -32 L4 -26 Z" fill="#0F2042"/>
  </g>
  
  <!-- Ribbon / Motto Arch -->
  <path d="M20 84 Q50 92 80 84" stroke="#0F2042" stroke-width="2" fill="none"/>
</svg>
