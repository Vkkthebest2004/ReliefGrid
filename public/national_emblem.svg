    <rect x="20" y="120" width="80" height="5" rx="1.5" fill="#002147"/>
    <rect x="15" y="125" width="90" height="4" rx="1" fill="#115CB9"/>
    
    <!-- Central Dharma Chakra on Base -->
    <circle cx="60" cy="116" r="4" fill="#FFFFFF"/>
    <circle cx="60" cy="116" r="3" stroke="#000A1E" stroke-width="0.8" fill="none"/>
    <circle cx="60" cy="116" r="0.8" fill="#000A1E"/>
    
    <!-- Bull on Right -->
    <path d="M82 114 Q87 112 90 114 Q88 118 82 118 Z" fill="#002147"/>
    <!-- Horse on Left -->
    <path d="M38 114 Q33 112 30 114 Q32 118 38 118 Z" fill="#002147"/>

    <!-- Central Lion Figure -->
    <path d="M50 112 C48 95 44 75 48 50 C50 35 70 35 72 50 C76 75 72 95 70 112 Z"/>
    <!-- Central Lion Mane details -->
    <path d="M54 50 C52 40 68 40 66 50 C68 62 66 75 60 85 C54 75 52 62 54 50 Z" fill="#115CB9"/>
    <path d="M56 42 C57 32 63 32 64 42 C65 52 64 62 60 70 C56 62 55 52 56 42 Z" fill="#002147"/>

    <!-- Left Lion Figure -->
    <path d="M42 112 C36 96 28 80 32 60 C35 48 48 50 48 62 C45 78 47 95 48 112 Z"/>
    <path d="M34 62 C32 54 44 54 44 64 C42 74 41 86 44 98 C38 88 35 76 34 62 Z" fill="#115CB9"/>

    <!-- Right Lion Figure -->
    <path d="M78 112 C84 96 92 80 88 60 C85 48 72 50 72 62 C75 78 73 95 72 112 Z"/>
    <path d="M86 62 C88 54 76 54 76 64 C78 74 79 86 76 98 C82 88 85 76 86 62 Z" fill="#115CB9"/>

    <!-- Crown & Ears -->
    <path d="M56 34 L60 26 L64 34 Z"/>
    <circle cx="51" cy="38" r="2.5"/>
    <circle cx="69" cy="38" r="2.5"/>
    
    <!-- Satyameva Jayate Motto Banner Arch -->
    <path d="M30 134 Q60 138 90 134" stroke="#002147" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>
  <text x="60" y="137" text-anchor="middle" font-family="'Public Sans', sans-serif" font-size="4.5" font-weight="bold" fill="#002147" letter-spacing="0.5">सत्यमेव जयते</text>
</svg>
